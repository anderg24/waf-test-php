<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demostración WAF Cloudflare</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; }
    button { padding: 10px 15px; margin-right: 10px; background: #056dff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button.danger { background: #d9381e; }
    pre { background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 4px; overflow-x: auto; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Prueba de WAF en Cloudflare Pages</h1>
    <p>Haz clic en los botones para probar el comportamiento del WAF:</p>
    
    <button onclick="probarPeticion('usuario=Anderson')">Enviar Petición Limpia</button>
    <button class="danger" onclick="probarPeticion('user=admin\' OR \'1\'=\'1')">Simular Ataque SQLi</button>
    
    <h3>Respuesta del Servidor / WAF:</h3>
    <pre id="output">Esperando acción...</pre>
  </div>

  <script>
    async function probarPeticion(query) {
      const output = document.getElementById('output');
      output.textContent = 'Enviando petición a Cloudflare...';
      
      try {
        // Petición a la misma página actual con parámetros
        const res = await fetch(`${window.location.pathname}?${query}`);
        const texto = await res.text();
        
        if (res.ok) {
          output.textContent = `Código HTTP: ${res.status} OK\n\nEl WAF permitió la solicitud.\nEl sitio cargó correctamente.`;
        } else {
          output.textContent = `Código HTTP: ${res.status}\n\n⚠️ Petición interceptada/rechazada por Cloudflare WAF.`;
        }
      } catch (err) {
        output.textContent = '❌ Petición bloqueada por el WAF / Red:\n' + err;
      }
    }
  </script>
</body>
</html>
