<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      max-width: 450px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      color: white;
      font-size: 2.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin: 0 auto 20px auto;
      box-shadow: 0 4px 10px rgba(56, 189, 248, 0.3);
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 8px 0;
      color: var(--text-main);
    }

    .career {
      color: var(--accent);
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .info-box {
      background-color: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 10px;
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .badge {
      display: inline-block;
      background-color: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar">AG</div>
    <h1>Estudiante de Ingenieria en sistemas test</h1>
    <div class="career">Ingeniería en Sistemas y Ciencias de la Computación</div>
    
    <div class="info-box">
      Universidad Mariano Gálvez de Guatemala<br>
      Desarrollo web
    </div>

    <div class="badge">Protegido por Cloudflare WAF 🛡️</div>
  </div>

</body>
</html>
